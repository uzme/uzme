<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Bahromjon Mengliyev — AI products, web applications and automation</title>
  <desc id="desc">A dark teal laboratory-inspired developer profile banner with a large MB monogram and developer status panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062f35"/>
      <stop offset="0.52" stop-color="#0b5358"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68e0c2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#68e0c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fdcff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b4f5e5" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1100" cy="65" r="155" fill="#49d9ba" opacity="0.08"/>
  <circle cx="1090" cy="62" r="95" fill="none" stroke="#75e7cd" stroke-opacity="0.16"/>
  <circle cx="1090" cy="62" r="65" fill="none" stroke="#75e7cd" stroke-opacity="0.22" stroke-dasharray="4 10">
    <animateTransform attributeName="transform" type="rotate" from="0 1090 62" to="360 1090 62" dur="22s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.7" fill="none" stroke="#83e8d0" stroke-width="1.5">
    <path d="M40 258 C180 220 210 272 335 232 S520 190 650 226" stroke-dasharray="5 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M700 286 C820 232 900 268 1010 218 S1170 165 1260 185" stroke="#81cfff" stroke-opacity="0.6" stroke-dasharray="3 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-84" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(64 64)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#68e0c2" filter="url(#softGlow)">
      <animate attributeName="y" values="0;10;0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="8" fill="#91f1d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">INDEPENDENT DEVELOPER / LAB-01</text>
    <text x="0" y="78" fill="#f2fffb" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5" filter="url(#textGlow)">Bahromjon Mengliyev</text>
    <rect x="2" y="102" width="510" height="2" fill="url(#glow)">
      <animate attributeName="width" values="180;510;180" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="140" fill="#b7f7e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AI PRODUCTS · WEB APPLICATIONS · AUTOMATION</text>
    <text x="0" y="181" fill="#d0e8ed" font-family="Arial, Helvetica, sans-serif" font-size="16">Building quietly, shipping deliberately.</text>
    <g transform="translate(0 218)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">
      <rect width="122" height="28" rx="14" fill="#8ae8d2" fill-opacity="0.16" stroke="#8ae8d2" stroke-opacity="0.45"/>
      <text x="18" y="18" fill="#b8ffed">TYPESCRIPT</text>
      <rect x="134" width="82" height="28" rx="14" fill="#8ae8d2" fill-opacity="0.16" stroke="#8ae8d2" stroke-opacity="0.45"/>
      <text x="154" y="18" fill="#b8ffed">REACT</text>
      <rect x="228" width="94" height="28" rx="14" fill="#8ae8d2" fill-opacity="0.16" stroke="#8ae8d2" stroke-opacity="0.45"/>
      <text x="248" y="18" fill="#b8ffed">AI / MCP</text>
    </g>
  </g>

  <g transform="translate(930 46)">
    <rect width="286" height="216" rx="20" fill="#031f2b" fill-opacity="0.62" stroke="#8ae8d2" stroke-opacity="0.35"/>
    <text x="24" y="31" fill="#8ae8d2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">BIO.LAB / STATUS</text>
    <circle cx="244" cy="27" r="5" fill="#68e0c2"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="143" y="91" text-anchor="middle" fill="#f2fffb" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="3" filter="url(#textGlow)">MB</text>
    <text x="143" y="111" text-anchor="middle" fill="#b7f7e8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">BAHROMJON MENGLIYEV</text>
    <text x="143" y="128" text-anchor="middle" fill="#8fb7ba" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.1">INDEPENDENT DEVELOPER</text>
    <path d="M24 143H262" stroke="#8ae8d2" stroke-opacity="0.2"/>
    <text x="24" y="166" fill="#b7f7e8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">SYSTEMS ONLINE</text>
    <text x="24" y="187" fill="#8fb7ba" font-family="Arial, Helvetica, sans-serif" font-size="11">AI PRODUCTS</text>
    <text x="162" y="187" fill="#68e0c2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">READY</text>
    <text x="24" y="207" fill="#8fb7ba" font-family="Arial, Helvetica, sans-serif" font-size="11">WEB / AUTOMATION</text>
    <text x="162" y="207" fill="#68e0c2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">ACTIVE</text>
  </g>
</svg>
