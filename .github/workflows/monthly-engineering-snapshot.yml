name: Monthly Engineering Snapshot

on:
  schedule:
    - cron: "10 8 1 * *"
  workflow_dispatch:

concurrency:
  group: profile-generated-reports
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate public monthly engineering snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-monthly-engineering-snapshot.mjs
      - name: Commit snapshot only when it changes
        run: |
          if git diff --quiet -- profile/monthly-engineering-snapshot.md profile/monthly-snapshot-metrics.json profile/monthly-snapshots; then
            echo "Monthly engineering snapshot has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/monthly-engineering-snapshot.md profile/monthly-snapshot-metrics.json profile/monthly-snapshots
          git commit -m "chore(profile): refresh monthly engineering snapshot"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Unable to push monthly engineering snapshot after three attempts."
          exit 1
