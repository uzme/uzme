name: Workflow Health Rollup

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate public workflow health rollup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-workflow-health-rollup.mjs
      - name: Commit rollup only when it changes
        run: |
          if git diff --quiet -- profile/workflow-health-rollup.md profile/workflow-health-metrics.json; then
            echo "Workflow health rollup has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/workflow-health-rollup.md profile/workflow-health-metrics.json
          git commit -m "chore(profile): refresh workflow health rollup"
          git push
