name: Weekly Automation Report

on:
  schedule:
    - cron: "15 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate repository automation report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-automation-report.mjs
      - name: Commit report only when it changes
        run: |
          if git diff --quiet -- profile/automation-report.md; then
            echo "Automation report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/automation-report.md
          git commit -m "chore(profile): refresh automation report"
          git push
      - name: Send optional Telegram summary
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=GitHub Automation: @uzme flagship repository reporti yangilandi. https://github.com/uzme/uzme/blob/main/profile/automation-report.md" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
