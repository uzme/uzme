name: Profile Link Health

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "profile/**"
  schedule:
    - cron: "30 7 * * 5"
  workflow_dispatch:

concurrency:
  group: profile-generated-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check public Markdown links
        id: link_check
        continue-on-error: true
        run: node scripts/check-profile-links.mjs
      - name: Commit scheduled health report
        if: always() && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- profile/link-health-report.md; then
            echo "Link health report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/link-health-report.md
          git commit -m "chore(profile): refresh link health report"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Unable to push link health report after three attempts."
          exit 1
      - name: Fail only for confirmed unhealthy links
        if: steps.link_check.outcome == 'failure'
        run: exit 1
