name: GitHub Automation Digest

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  security-events: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate repository automation report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-automation-report.mjs
      - name: Commit report only when it changes
        run: |
          if git diff --quiet -- profile/automation-report.md profile/engineering-dashboard.md profile/achievement-log.md profile/automation-metrics.json profile/telegram-digest.txt; then
            echo "Automation report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/automation-report.md profile/engineering-dashboard.md profile/achievement-log.md profile/automation-metrics.json profile/telegram-digest.txt
          git commit -m "chore(profile): refresh automation report"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Unable to push automation report after three attempts."
          exit 1
      - name: Send optional Telegram summary
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::notice::Telegram secrets are not configured; no external message was sent."
            exit 0
          fi
          if [ ! -s profile/telegram-digest.txt ]; then
            echo "No digest-worthy change detected; no external message was sent."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@profile/telegram-digest.txt" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
